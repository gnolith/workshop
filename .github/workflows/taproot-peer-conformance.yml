name: Taproot peer conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packed-peer-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Materialize checksum-bound local peer artifacts
        run: node scripts/materialize-peer-artifacts.mjs
      - run: npm ci
      - name: Verify the exact assembled packed process
        run: npm run packed:process-check
